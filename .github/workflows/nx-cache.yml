name: Nx cache

# Every commit that lands on main saves Nx's cache for the build and the
# typecheck, which every pull request's CI restores (ci.yml). Each project's
# hash reads the whole bun.lock (nx.json's `workspaceConfig`), so a cache
# saved once a night, by CI's nightly run, was stale by the first dependency
# update of the day, and pull requests rebuilt everything. This saves it
# again after each merge, and runs nothing else: CI checked the commit in
# the merge queue before it landed.
on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on main makes an older one's cache worth nothing.
concurrency:
  group: nx-cache
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  NX_NO_CLOUD: "true"
  # As in ci.yml, which restores what this saves.
  NX_CACHE_DIRECTORY: .nx/cache
  NX_MAX_CACHE_SIZE: 1GB

jobs:
  save:
    name: save (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [build, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          nx-cache: ${{ matrix.target }}
      - run: bun run "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      # The key ci.yml's jobs restore by its prefix, as its own jobs save it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}

  # What main saves is read from its newest entry alone: CodeQL's base
  # database for each language (its default setup, about 530 MB for
  # JavaScript, saved again at every push and never removed) and Nx's
  # caches above. The older ones only fill the repository's 10 GB, where
  # GitHub then evicts what the jobs still read, like the browsers' cache.
  # This keeps the newest entry of each on main and deletes the others.
  prune:
    needs: save
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | select(.key | test("^(codeql-overlay-base-database-|nx-)")) | [.id, .key, .created_at] | @tsv' |
            jq --raw-input --slurp --raw-output '
              split("\n") | map(select(. != "") | split("\t") | {id: .[0], key: .[1], created: .[2]})
              | group_by(.key | sub("-[0-9a-f]{40}.*$"; ""))
              | map(sort_by(.created) | .[:-1][]) | .[] | "\(.id)\t\(.key)"' |
            while IFS=$'\t' read -r id key; do
              echo "Deleting $key"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
            done
        env:
          GH_TOKEN: ${{ github.token }}
