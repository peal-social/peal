# The production stack: Postgres with pgBackRest, the server, the web app, the
# static site and docs, the docs server for their assistant, and the
# telemetry stack (the OpenTelemetry Collector,
# Loki, Tempo, Prometheus and Grafana with its alerts). peal-infra runs it on
# Peal's servers behind a Cloudflare Tunnel; self-hosters add Caddy in front
# with compose.self-host.yaml.
#
# Every published port listens on 127.0.0.1 only: the tunnel or Caddy is the
# only way in, and Docker's own firewall rules never open a port to the world.
#
#   Server (API)    127.0.0.1:3000    /api/* and /.well-known/oauth-*
#   Web app         127.0.0.1:3001    everything else on the app's host name
#   Marketing site  127.0.0.1:4321    profile "static"
#   Docs            127.0.0.1:4322    profile "static"
#   Docs server     127.0.0.1:4323    profile "docs", with the assistant
#   Grafana         127.0.0.1:13000
#   OTLP HTTP       127.0.0.1:14318   where the backup timer reports
#
# Settings come from the environment Compose runs in, or from --env-file
# files. Settings marked `:?` are required, and Compose names the one
# missing; the others are passed through by name, so one that is unset stays
# unset in the container rather than empty. The images are built from the
# repository (`docker compose build`, or the release playbook) and tagged
# PEAL_VERSION (PEAL_POSTGRES_VERSION for Postgres), `local` unless set.

x-service: &service
  restart: unless-stopped
  # Containers write only to their volumes and to the tmpfs mounts listed,
  # and nothing they run gains privileges it was not started with. A service
  # with more tmpfs mounts lists /tmp again: a merge replaces the list.
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m]
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

# Health checks probe often while a service starts, so `up --wait` returns as
# soon as everything is ready, then settle to every 10 seconds.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s
  start_interval: 1s

services:
  # Postgres with pgBackRest. PEAL_POSTGRES_ARCHIVE_MODE=on archives the
  # write-ahead log to the bucket the PGBACKREST_REPO1_* settings name;
  # backups run from the host (peal-infra's peal_backup role). Its image has
  # a tag of its own, which changes only with postgres.Dockerfile, so a
  # release restarts Postgres only when its image or its settings change.
  postgres:
    <<: *service
    image: peal-postgres:${PEAL_POSTGRES_VERSION:-local}
    build:
      context: ../..
      dockerfile: packages/peal-docker/postgres.Dockerfile
    command:
      - postgres
      - -c
      - archive_mode=${PEAL_POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_command=pgbackrest archive-push %p
      # A write-ahead log segment is archived at least every 5 minutes, which
      # bounds what a restore can lose.
      - -c
      - archive_timeout=300
      # Memory, each defaulting to PostgreSQL 18's own value; the docs'
      # environment variables page says how to size them. Given here, they
      # override ALTER SYSTEM and postgresql.conf for these four.
      # shared_buffers is read only at start, and is not in /dev/shm.
      - -c
      - shared_buffers=${PEAL_POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PEAL_POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${PEAL_POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - random_page_cost=${PEAL_POSTGRES_RANDOM_PAGE_COST:-4}
    environment:
      POSTGRES_USER: peal
      POSTGRES_DB: peal
      # Part of DATABASE_URL below: keep it URL-safe (openssl rand -hex 32).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGBACKREST_STANZA: peal
      PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker
      PGBACKREST_PG1_USER: peal
      PGBACKREST_REPO1_TYPE: ${PGBACKREST_REPO1_TYPE:-s3}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/peal}
      PGBACKREST_REPO1_S3_ENDPOINT:
      PGBACKREST_REPO1_S3_BUCKET:
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-auto}
      PGBACKREST_REPO1_S3_URI_STYLE: ${PGBACKREST_REPO1_S3_URI_STYLE:-path}
      PGBACKREST_REPO1_S3_KEY:
      PGBACKREST_REPO1_S3_KEY_SECRET:
      # Backups are encrypted before they leave the host.
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS:
      # Four weekly full backups, with the daily differential ones and the
      # write-ahead log between them: point-in-time recovery over three to
      # four weeks, as each full backup expires the oldest.
      PGBACKREST_REPO1_RETENTION_FULL: "4"
      PGBACKREST_REPO1_BUNDLE: "y"
      PGBACKREST_REPO1_BLOCK: "y"
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: "off"
    # /dev/shm: the dynamic shared memory of parallel queries, and of a
    # parallel vacuum, up to maintenance_work_mem. Keep it above that.
    shm_size: 1g
    # The socket folder, and /tmp, where pgBackRest keeps its locks.
    tmpfs: [/tmp:size=64m, /var/run/postgresql:size=1m]
    volumes:
      # Postgres 18 images keep PGDATA in a versioned folder below this one.
      - postgres:/var/lib/postgresql
    # A clean shutdown spares the next start a crash recovery.
    stop_grace_period: 60s
    healthcheck:
      <<: *healthcheck
      # Over TCP: while the image initialises a new database, it runs a
      # temporary server on the Unix socket alone, which then shuts down.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=peal, --dbname=peal]

  # Applies pending migrations before it listens, so starting a new release
  # migrates the database.
  server:
    <<: *service
    image: peal-server:${PEAL_VERSION:-local}
    build:
      context: ../..
      dockerfile: packages/peal-docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://peal:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/peal
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL, the address people open Peal at}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      # cf-connecting-ip behind Cloudflare, x-forwarded-for behind Caddy.
      AUTH_IP_HEADERS: ${AUTH_IP_HEADERS:?Set AUTH_IP_HEADERS}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      PEAL_S3_ENDPOINT: ${PEAL_S3_ENDPOINT:?Set PEAL_S3_ENDPOINT}
      PEAL_S3_BUCKET: ${PEAL_S3_BUCKET:?Set PEAL_S3_BUCKET}
      PEAL_S3_ACCESS_KEY_ID: ${PEAL_S3_ACCESS_KEY_ID:?Set PEAL_S3_ACCESS_KEY_ID}
      PEAL_S3_SECRET_ACCESS_KEY: ${PEAL_S3_SECRET_ACCESS_KEY:?Set PEAL_S3_SECRET_ACCESS_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: ${PEAL_VERSION:-local}
      # Optional: the docs' environment variables page says what each does.
      # The container sees no other variable, so each setting the server
      # reads is named here (test/compose.test.ts checks it against the docs).
      PEAL_TOKEN_KEYS:
      BLUESKY_CLIENT_KEYS:
      LINKEDIN_CLIENT_ID:
      LINKEDIN_CLIENT_SECRET:
      LINKEDIN_PAGES_CLIENT_ID:
      LINKEDIN_PAGES_CLIENT_SECRET:
      LINKEDIN_API_VERSION:
      LINKEDIN_DAILY_COMMENT_CALLS:
      LINKEDIN_DAILY_COMMENT_CALLS_PER_MEMBER:
      META_APP_ID:
      META_APP_SECRET:
      INSTAGRAM_APP_ID:
      INSTAGRAM_APP_SECRET:
      THREADS_APP_ID:
      THREADS_APP_SECRET:
      PINTEREST_APP_ID:
      PINTEREST_APP_SECRET:
      PINTEREST_SANDBOX:
      TIKTOK_CLIENT_KEY:
      TIKTOK_CLIENT_SECRET:
      X_CLIENT_ID:
      X_CLIENT_SECRET:
      X_ANALYTICS:
      X_ANALYTICS_DAILY_READS:
      X_THREADS:
      GOOGLE_BUSINESS_CLIENT_ID:
      GOOGLE_BUSINESS_CLIENT_SECRET:
      YOUTUBE_CLIENT_ID:
      YOUTUBE_CLIENT_SECRET:
      YOUTUBE_DAILY_UPLOADS:
      YOUTUBE_DAILY_THUMBNAILS:
      YOUTUBE_DAILY_COMMENT_UNITS:
      RESEND_API_KEY:
      SMTP_URL:
      TRUSTED_ORIGINS:
      AUTH_TRUSTED_PROXIES:
      AUTH_REQUIRE_EMAIL_VERIFICATION:
      AUTH_DB_POOL_MAX:
      BETTER_AUTH_SECRETS:
      MCP_DYNAMIC_REGISTRATION:
      PEAL_PARTNER_SELF_SERVICE:
      PEAL_SIGN_UP:
      PEAL_STAFF_TWO_STEP:
      PEAL_S3_REGION:
      PEAL_S3_FORCE_PATH_STYLE:
      PEAL_S3_KEY_PREFIX:
      PEAL_MEDIA_PUBLIC_BASE_URL:
      PEAL_ERASURE_LEDGER_BUCKET:
      PEAL_MEDIA_SWEEPS:
      PEAL_MEDIA_SWEEP_ORPHANS_LIMIT:
      PEAL_MEDIA_SWEEP_PENDING_LIMIT:
      PEAL_MEDIA_SWEEP_PENDING_AFTER:
      PEAL_MEDIA_SWEEP_UPLOADS_AFTER:
      PEAL_MEDIA_SWEEP_ORPHANS_AFTER:
      PEAL_MEDIA_SWEEP_BATCH:
      TIKTOK_MEDIA_URL_PREFIX:
      PEAL_FFPROBE_PATH:
      PEAL_MAX_CONCURRENT_UPLOADS:
      PEAL_AI_PROVIDER:
      PEAL_AI_API_KEY:
      PEAL_AI_MODEL:
      PEAL_AI_BASE_URL:
      PEAL_AI_DAILY_REQUESTS:
      PEAL_AI_IMAGE_PROVIDER:
      PEAL_AI_IMAGE_BASE_URL:
      PEAL_AI_IMAGE_API_KEY:
      PEAL_AI_IMAGE_MODEL:
      PEAL_ADS:
      PEAL_OUTBOUND_ALLOWED_HOSTS:
      PEAL_INBOX_PLATFORMS:
      PEAL_INBOX_MESSAGES:
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_METER_WEBHOOK_SECRET:
      STRIPE_LOOKUP_KEY_PREFIX:
      PEAL_BILLING_GRACE_UNTIL:
      STRIPE_API_URL:
      TURNSTILE_SITE_KEY:
      TURNSTILE_SECRET_KEY:
      TURNSTILE_VERIFY_URL:
      OTEL_SERVICE_NAME:
      OTEL_TRACES_EXPORTER:
      OTEL_TRACES_SAMPLER:
      OTEL_TRACES_SAMPLER_ARG:
      OTEL_METRICS_EXPORTER:
      OTEL_LOGS_EXPORTER:
      PEAL_CLUSTER_RETENTION:
      PEAL_ANALYTICS_CONCURRENCY:
      PEAL_API_REQUESTS_PER_MINUTE:
      PEAL_DOCS_URL:
      PEAL_ENGAGEMENT_CONCURRENCY:
      PEAL_ENGAGEMENT_WINDOW_DAYS:
      PEAL_LEGAL_RETENTION:
      PEAL_SHORT_LINK_BASE:
      # What the operator declares about its processing, for each user's
      # export: the file PEAL_PRIVACY_DECLARATION names, mounted below.
      PEAL_PRIVACY_DECLARATION_FILE: /etc/peal/privacy-declaration.json
    volumes:
      # Declares nothing unless PEAL_PRIVACY_DECLARATION names a file of
      # the operator's, as self-host/privacy-declaration.example.json shows.
      - ${PEAL_PRIVACY_DECLARATION:-./config/production/privacy-declaration.json}:/etc/peal/privacy-declaration.json:ro
    ports:
      - 127.0.0.1:${PEAL_SERVER_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
    # The server waits up to 60 seconds for requests and calls to the
    # platforms in flight before it stops (packages/peal-server/src/app/
    # shutdown.ts); Docker's default 10 seconds would cut them short.
    stop_grace_period: 75s
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bun
        - --eval
        - 'const response = await fetch("http://127.0.0.1:3000/api/health"); process.exit(response.ok ? 0 : 1);'

  web:
    <<: *service
    image: peal-web:${PEAL_VERSION:-local}
    build:
      context: ../..
      dockerfile: packages/peal-docker/web.Dockerfile
    # Node runs as PID 2 under an init, so it stops on SIGTERM.
    init: true
    # Next's cache of optimised images and fetches, rebuilt after a restart.
    tmpfs: [/tmp:size=64m, /app/packages/peal-web/.next/cache:size=256m]
    environment:
      PEAL_API_URL: http://server:3000
      # Named in the web app's error reports.
      PEAL_RELEASE: ${PEAL_VERSION:-local}
      # The terms of service the sign-up form and the billing page link to.
      PEAL_TERMS_URL:
      # The privacy policy the sign-up form links to.
      PEAL_PRIVACY_URL:
      # Where to write for more than the largest plan allows.
      PEAL_CONTACT_URL:
      # Longer than the edge keeps idle connections (90 s for the tunnel, 2
      # minutes for Caddy), so it never reuses one Node has closed.
      KEEP_ALIVE_TIMEOUT: "125000"
    ports:
      - 127.0.0.1:${PEAL_WEB_PORT:-3001}:3001
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - node
        - --eval
        - 'fetch("http://127.0.0.1:3001/sign-in", { redirect: "manual" }).then((response) => process.exit(response.status < 500 ? 0 : 1), () => process.exit(1));'

  # The marketing site and the docs, built with the settings below.
  static:
    <<: *service
    profiles: [static]
    image: peal-static:${PEAL_VERSION:-local}
    build:
      context: ../..
      dockerfile: packages/peal-docker/static.Dockerfile
      args:
        SITE_URL: ${SITE_URL:-}
        SITE_APP_URL: ${SITE_APP_URL:-}
        SITE_DOCS_URL: ${SITE_DOCS_URL:-}
        SITE_PLAUSIBLE_DOMAIN: ${SITE_PLAUSIBLE_DOMAIN:-}
        SITE_PLAUSIBLE_HOST: ${SITE_PLAUSIBLE_HOST:-}
        DOCS_SITE_URL: ${DOCS_SITE_URL:-}
        DOCS_APP_URL: ${DOCS_APP_URL:-}
        DOCS_PLAUSIBLE_DOMAIN: ${DOCS_PLAUSIBLE_DOMAIN:-}
        DOCS_PLAUSIBLE_HOST: ${DOCS_PLAUSIBLE_HOST:-}
    ports:
      - 127.0.0.1:${PEAL_SITE_PORT:-4321}:8080
      - 127.0.0.1:${PEAL_DOCS_PORT:-4322}:8081
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/, http://127.0.0.1:8081/]

  # The docs as a Node server, with the assistant that answers from their
  # pages: the docs' host name goes here instead of to the static image's
  # docs. Built only with DOCS_ASSISTANT_MODEL set; the docs' environment
  # variables page says what each setting does.
  docs:
    <<: *service
    profiles: [docs]
    image: peal-docs:${PEAL_VERSION:-local}
    build:
      context: ../..
      dockerfile: packages/peal-docker/docs.Dockerfile
      args:
        DOCS_ASSISTANT_MODEL: ${DOCS_ASSISTANT_MODEL:-}
        DOCS_TURNSTILE_SITE_KEY: ${DOCS_TURNSTILE_SITE_KEY:-}
        DOCS_SITE_URL: ${DOCS_SITE_URL:-}
        DOCS_APP_URL: ${DOCS_APP_URL:-}
        DOCS_PLAUSIBLE_DOMAIN: ${DOCS_PLAUSIBLE_DOMAIN:-}
        DOCS_PLAUSIBLE_HOST: ${DOCS_PLAUSIBLE_HOST:-}
    # Node runs as PID 2 under an init, so it stops on SIGTERM.
    init: true
    environment:
      # Read with each question; the assistant answers that it is not set
      # up until it is.
      DOCS_ANTHROPIC_API_KEY:
      # Read only when the image was built with DOCS_TURNSTILE_SITE_KEY.
      DOCS_TURNSTILE_SECRET_KEY:
      # The header the edge gives each reader's address in, as for the
      # server: the rate limit counts each reader by it.
      AUTH_IP_HEADERS: ${AUTH_IP_HEADERS:?Set AUTH_IP_HEADERS}
    ports:
      - 127.0.0.1:${PEAL_DOCS_SERVER_PORT:-4323}:4323
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - node
        - --eval
        - 'fetch("http://127.0.0.1:4323/").then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1));'

  # The collector's image has no shell or HTTP client, so its health check
  # runs busybox's static wget, which this service copies into a volume at
  # each `up`, then exits. An image mount would be simpler, but Docker does
  # not mount the image again when its daemon restarts, and the collector
  # then restarts on an empty folder. The copy is renamed into place, so a
  # health check running the old one never sees a partial file.
  collector-wget:
    <<: *service
    image: busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    command: [sh, -c, "cp /bin/busybox /tools/.wget && mv -f /tools/.wget /tools/wget"]
    restart: "no"
    network_mode: none
    volumes:
      - collector-wget:/tools

  otel-collector:
    <<: *service
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    volumes:
      - ./config/production/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # The host's filesystem, read-only, for its disk, memory and load.
      - /:/hostfs:ro,rslave
      # busybox's wget, for the health check (collector-wget).
      - collector-wget:/busybox:ro
    ports:
      - 127.0.0.1:${PEAL_OTLP_HTTP_PORT:-14318}:4318
    depends_on:
      collector-wget:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /busybox/wget, -q, -O, /dev/null, http://127.0.0.1:13133/]

  loki:
    <<: *service
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./config/production/loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/bin/loki, -health]

  # Tempo keeps traces for 14 days, stated in its production configuration.
  tempo:
    <<: *service
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: [-target=all, -config.file=/etc/tempo/config.yaml]
    volumes:
      - ./config/production/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    healthcheck:
      <<: *healthcheck
      test: [CMD, /tempo, -health]

  prometheus:
    <<: *service
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    healthcheck:
      <<: *healthcheck
      test: [CMD, promtool, check, ready]

  # Signed in through Cloudflare Access when PEAL_GRAFANA_ACCESS_TEAM is set:
  # Grafana checks the token Access adds to each request, and signs its
  # email in as an Admin of its organisation, with full access: the Access
  # application's policy decides who that is, the staff. Grafana sets the
  # role again at each sign-in. Otherwise, the admin account and its
  # password.
  grafana:
    <<: *service
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_SERVER_ROOT_URL: ${PEAL_GRAFANA_URL:-http://localhost:13000}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_JWT_ENABLED: ${PEAL_GRAFANA_ACCESS_TEAM:+true}
      GF_AUTH_JWT_HEADER_NAME: Cf-Access-Jwt-Assertion
      GF_AUTH_JWT_EMAIL_CLAIM: email
      GF_AUTH_JWT_USERNAME_CLAIM: email
      GF_AUTH_JWT_JWK_SET_URL: https://${PEAL_GRAFANA_ACCESS_TEAM:-}.cloudflareaccess.com/cdn-cgi/access/certs
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"aud": "${PEAL_GRAFANA_ACCESS_AUD:-}", "iss": "https://${PEAL_GRAFANA_ACCESS_TEAM:-}.cloudflareaccess.com"}'
      GF_AUTH_JWT_CACHE_TTL: 60m
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH: "'Admin'"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Grafana would otherwise replace the data source plugins its image
      # ships, Prometheus's and Loki's that the alerts query included, with
      # their latest release each time it starts: the image decides them.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the Telegram contact point, when it is mounted, and by the
      # Telegram and Slack one, which names the environment in Slack's
      # messages.
      TELEGRAM_BOT_TOKEN:
      TELEGRAM_CHAT_ID:
      SLACK_ALERTS_WEBHOOK_URL:
      PEAL_GRAFANA_ENVIRONMENT: ${PEAL_GRAFANA_ENVIRONMENT:-production}
      # Read by the heartbeat, when it is mounted.
      PEAL_HEARTBEAT_URL:
      PEAL_HEARTBEAT_TOKEN:
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/production/grafana/alerting/rules.yaml:/etc/grafana/provisioning/alerting/rules.yaml:ro
      - ./config/production/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/production/grafana/dashboards:/etc/grafana/dashboards:ro
      - ${PEAL_GRAFANA_CONTACT_POINTS:-./config/production/grafana/alerting/none.yaml}:/etc/grafana/provisioning/alerting/contact-points.yaml:ro
      - ${PEAL_GRAFANA_HEARTBEAT:-./config/production/grafana/alerting/none.yaml}:/etc/grafana/provisioning/alerting/heartbeat.yaml:ro
      - grafana:/var/lib/grafana
    ports:
      - 127.0.0.1:${PEAL_GRAFANA_PORT:-13000}:3000
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]

