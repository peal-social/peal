# The static image (static.Dockerfile): the marketing site on 8080 and the
# docs on 8081, each answering for whatever host the edge sends it.
#
# Idle connections stay open longer than the edge keeps them (90 s for the
# Cloudflare Tunnel, 2 minutes for Caddy), so the edge never reuses one that
# nginx has just closed. Pages answer at their path with or without a
# trailing slash, and redirects keep the path only, so they work behind any
# host name and port.

server_tokens off;
absolute_redirect off;
charset utf-8;
charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;
gzip on;
gzip_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

# HSTS as the web app sends it (packages/peal-web/next.config.ts), on
# answers to a reader who came over HTTPS: nginx sits behind the edge (the
# tunnel or Caddy), which ends TLS and says so in X-Forwarded-Proto. An
# empty value sends no header, so a plain-HTTP request on the host, such as
# the health check's, gets none. A location with add_header lines of its own
# drops the server's, so each repeats it.
map $http_x_forwarded_proto $strict_transport_security {
    https   "max-age=63072000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    keepalive_timeout 125s;

    root /usr/share/nginx/site;

    # The agent skill the site publishes under /.well-known/agent-skills is
    # Markdown, which nginx's own types do not know.
    types {
        text/markdown md;
    }
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $strict_transport_security always;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Astro's bundles have a hash in their names.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $strict_transport_security always;
    }
}

server {
    listen 8081;
    keepalive_timeout 125s;

    root /usr/share/nginx/docs;
    error_page 404 /404.html;

    # Blume writes each page as Markdown too, for agents; nginx's own types
    # do not know them.
    types {
        text/markdown md mdx;
    }
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $strict_transport_security always;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /.well-known/api-catalog {
        default_type "application/linkset+json";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $strict_transport_security always;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $strict_transport_security always;
    }

    # Blume's settings for hosts that read them; nginx applies its own.
    location ~ ^/(_headers|_redirects|vercel\.json|blume-redirects\.json)$ {
        return 404;
    }
}
