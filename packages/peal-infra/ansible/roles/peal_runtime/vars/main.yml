---
# The plain settings host.env gives compose.production.yaml, by name: the
# inventory's, then peal_settings, which may replace them. With
# peal_site_measurement, the web app's relay answers the site's measurement
# (PEAL_POSTHOG_SITE), with the address AUTH_IP_HEADERS names, and the
# server expires the visitor's cookie on the site's host name, the parent
# of the docs'. Secrets are in
# secrets.env (generated on the server) and credentials.env (issued by
# outside services), beside it.
peal_runtime_host_settings: >-
  {{ {
       'PUBLIC_URL': 'https://' ~ peal_hostnames.app,
       'PEAL_TERMS_URL': 'https://' ~ peal_hostnames.site ~ '/terms/',
       'PEAL_PRIVACY_URL': 'https://' ~ peal_hostnames.site ~ '/privacy/',
       'PEAL_DOCS_URL': 'https://' ~ peal_hostnames.docs,
       'AUTH_IP_HEADERS': 'cf-connecting-ip',
       'PEAL_DATABASE_USER': 'peal_server',
       'MAIL_FROM': peal_mail_from,
       'PEAL_LEGAL_RETENTION': peal_legal_retention,
       'PEAL_PRIVACY_DECLARATION': peal_root ~ '/privacy-declaration.json',
       'PEAL_S3_ENDPOINT': peal_media_endpoint,
       'PEAL_S3_BUCKET': peal_media_bucket,
       'PEAL_POSTGRES_ARCHIVE_MODE': 'on',
       'PGBACKREST_REPO1_S3_ENDPOINT': peal_backup_endpoint,
       'PGBACKREST_REPO1_S3_BUCKET': peal_backup_bucket,
       'PGBACKREST_REPO1_PATH': peal_backup_path,
       'PEAL_GRAFANA_URL': 'https://' ~ peal_hostnames.grafana,
       'PEAL_GRAFANA_ACCESS_TEAM': cloudflare_access_team,
       'PEAL_GRAFANA_ACCESS_AUD': cloudflare_access_aud.grafana,
       'PEAL_GRAFANA_CONTACT_POINTS': './config/production/grafana/alerting/'
                                      ~ ('telegram-slack.yaml' if peal_runtime_slack_alerts | bool else 'telegram.yaml'),
       'PEAL_GRAFANA_ENVIRONMENT': peal_environment,
       'PEAL_POSTHOG_ENVIRONMENT': peal_environment,
       'PEAL_SERVER_PORT': peal_ports.server,
       'PEAL_WEB_PORT': peal_ports.web,
       'PEAL_SITE_PORT': peal_ports.site,
       'PEAL_DOCS_PORT': peal_ports.docs,
       'PEAL_DOCS_SERVER_PORT': peal_ports.docs_server,
       'PEAL_GRAFANA_PORT': peal_ports.grafana,
       'PEAL_OTLP_HTTP_PORT': peal_ports.otlp_http,
     }
     | combine({'PEAL_SHORT_LINK_BASE': 'https://' ~ peal_short_link_hostname ~ '/'}
               if peal_short_link_hostname else {})
     | combine({'PEAL_ERASURE_LEDGER_BUCKET': peal_erasure_ledger_bucket}
               if peal_erasure_ledger_bucket else {})
     | combine({
         'PEAL_GRAFANA_HEARTBEAT': './config/production/grafana/alerting/heartbeat.yaml',
         'PEAL_HEARTBEAT_URL': peal_heartbeat_url,
       } if peal_heartbeat_url else {})
     | combine({
         'PEAL_POSTHOG_SITE': 'on',
         'PEAL_POSTHOG_SITE_COOKIE_DOMAIN': peal_hostnames.site,
       } if peal_site_measurement | bool else {})
     | combine(peal_runtime_blog_settings if peal_blog | bool else {})
     | combine(peal_settings) }}

# The blog's plain settings (compose.production.yaml's blog service): its
# origin, its bucket on the media's endpoint (so the EU check covers it),
# the site's links, its measurement as the site's (peal_site_measurement:
# PostHog's project token, public, which the vault gives), and EmDash's
# SMTP through Resend's relay, whose password Compose hands the blog from
# its own key, PEAL_BLOG_RESEND_API_KEY, only with PEAL_BLOG_MAIL.
peal_runtime_blog_settings: >-
  {{ {
       'PEAL_BLOG_PORT': peal_ports.blog,
       'PEAL_BLOG_SITE_URL': 'https://' ~ peal_hostnames.site,
       'PEAL_BLOG_S3_ENDPOINT': peal_media_endpoint,
       'PEAL_BLOG_S3_BUCKET': peal_blog_bucket,
     }
     | combine({
         'BLOG_APP_URL': peal_static_build_args.SITE_APP_URL | default(''),
         'BLOG_DOCS_URL': peal_static_build_args.SITE_DOCS_URL | default(''),
         'BLOG_DISCORD_URL': peal_static_build_args.SITE_DISCORD_URL | default(''),
         'BLOG_CRISP_WEBSITE_ID': peal_static_build_args.SITE_CRISP_WEBSITE_ID | default(''),
       })
     | combine({
         'BLOG_POSTHOG_KEY': peal_site_measurement_token,
         'BLOG_POSTHOG_HOST': peal_site_measurement_host,
         'BLOG_POSTHOG_COOKIE_DOMAIN': peal_hostnames.site,
         'BLOG_POSTHOG_ENVIRONMENT': peal_environment,
       } if peal_site_measurement | bool else {})
     | combine({
         'EMAIL_SMTP_HOST': 'smtp.resend.com',
         'EMAIL_SMTP_PORT': 465,
         'EMAIL_SMTP_SECURE': 'tls',
         'EMAIL_SMTP_USER': 'resend',
         'EMAIL_SMTP_FROM': peal_mail_from,
         'PEAL_BLOG_MAIL': true,
       } if peal_blog_mail | bool else {}) }}

# Grafana alerts Slack too, beside Telegram, once the environment's Slack
# webhook (SLACK_ALERTS_WEBHOOK_URL, to #alerts-production or
# #alerts-sandbox) is among its credentials: in the vault, or found by name
# in credentials.env on the server. Grafana refuses to start on a contact
# point whose setting is missing, so the file follows the credentials.
peal_runtime_optional_credentials: [SLACK_ALERTS_WEBHOOK_URL, PEAL_POSTHOG_KEY]
# The optional credentials given a value: in the vault, or found by name in
# credentials.env on the server.
peal_runtime_optional_given: >-
  {{ (peal_credentials | dict2items | rejectattr('value', 'equalto', '') | rejectattr('value', 'none')
      | map(attribute='key') | list)
     if peal_credentials is defined
     else (peal_runtime_optional_set.stdout_lines | default([])) }}
peal_runtime_slack_alerts: "{{ 'SLACK_ALERTS_WEBHOOK_URL' in peal_runtime_optional_given }}"

# Product analytics on Peal's servers only with its erasure: PostHog's
# project token among the credentials requires PEAL_POSTHOG_PROJECT_ID in
# peal_settings, which requires the personal key in turn (below), so a
# server never captures what it could not delete. The software takes a
# token alone, for a self-hoster who deletes by hand.
peal_runtime_posthog_on: "{{ 'PEAL_POSTHOG_KEY' in peal_runtime_optional_given }}"

# The credentials this server needs, by name: peal_required_credentials, the
# heartbeat's token when Grafana sends one, the docs' assistant's key
# when the docs run as a server, the blog's bucket key and Resend key
# where it runs (never the server's RESEND_API_KEY), and the secret of each app whose id
# peal_settings gives, as the server refuses to start with one half of an
# app alone (oauthClientConfig, Google sign-in): the release stops first.
peal_runtime_required_credentials: >-
  {{ peal_required_credentials
     + (['PEAL_HEARTBEAT_TOKEN'] if peal_heartbeat_url else [])
     + (['DOCS_ANTHROPIC_API_KEY'] if peal_docs_server | bool else [])
     + (['PEAL_BACKUP_COPY_S3_ACCESS_KEY_ID', 'PEAL_BACKUP_COPY_S3_SECRET_ACCESS_KEY']
        if peal_backup_copy | default(false) | bool else [])
     + (['PEAL_BLOG_S3_ACCESS_KEY_ID', 'PEAL_BLOG_S3_SECRET_ACCESS_KEY']
        + (['PEAL_BLOG_RESEND_API_KEY'] if peal_blog_mail | bool else []) if peal_blog | bool else [])
     + ({
          'LINKEDIN_CLIENT_ID': 'LINKEDIN_CLIENT_SECRET',
          'LINKEDIN_PAGES_CLIENT_ID': 'LINKEDIN_PAGES_CLIENT_SECRET',
          'X_CLIENT_ID': 'X_CLIENT_SECRET',
          'TIKTOK_CLIENT_KEY': 'TIKTOK_CLIENT_SECRET',
          'YOUTUBE_CLIENT_ID': 'YOUTUBE_CLIENT_SECRET',
          'PINTEREST_APP_ID': 'PINTEREST_APP_SECRET',
          'GOOGLE_BUSINESS_CLIENT_ID': 'GOOGLE_BUSINESS_CLIENT_SECRET',
          'WORDPRESS_COM_CLIENT_ID': 'WORDPRESS_COM_CLIENT_SECRET',
          'SLACK_CLIENT_ID': 'SLACK_CLIENT_SECRET',
          'GOOGLE_SIGN_IN_CLIENT_ID': 'GOOGLE_SIGN_IN_CLIENT_SECRET',
          'PEAL_POSTHOG_PROJECT_ID': ['PEAL_POSTHOG_KEY', 'PEAL_POSTHOG_PERSONAL_API_KEY'],
        } | dict2items
        | selectattr('key', 'in', (peal_settings | default({})).keys() | list)
        | map(attribute='value') | flatten | list) }}
