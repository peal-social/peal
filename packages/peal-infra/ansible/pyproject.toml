# The Ansible toolchain for the servers that run Peal, managed with uv:
# `uv sync --locked` installs it in .venv, with the test suite's own
# packages (the dev group).
[project]
name = "peal-infra"
version = "0.0.0"
description = "Ansible for the servers that run Peal."
license = "FSL-1.1-ALv2"
requires-python = ">=3.14"
dependencies = ["ansible-core==2.22.0", "ansible-lint==26.11.0"]

# tests/ reads the roles' tasks and templates with these, as Ansible does.
[dependency-groups]
dev = ["jinja2==3.1.6", "pytest==9.2.0", "pytest-xdist==3.8.0", "pyyaml==6.0.3"]

[tool.uv]
package = false

# No cache folder in the package; tests that need Docker skip without it.
# The tests run in parallel, one worker a CPU (pytest-xdist), each group of
# tests that share a module's containers (xdist_group) in one of them.
[tool.pytest]
testpaths = ["tests"]
addopts = [
  "-p",
  "no:cacheprovider",
  "--numprocesses",
  "auto",
  "--dist",
  "loadgroup",
  "--durations=60",
  "--durations-min=1",
]
