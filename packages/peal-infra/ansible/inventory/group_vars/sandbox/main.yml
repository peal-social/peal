---
# The sandbox: pre-production, with its own database, buckets and platform
# redirect URIs, behind Cloudflare Access throughout. The host names are the official
# ones; the other values are placeholders until the Cloudflare account and
# the server exist.
server_hostname: peal-sandbox
peal_environment: sandbox

# Where it is hosted (group_vars/production says how to write them). The
# sandbox may share production's provider and city: it does not watch it.
hosting_provider: REPLACE-WITH-THE-PROVIDER-OF-THE-SANDBOX
hosting_location: REPLACE-WITH-THE-CITY-OF-THE-SANDBOX

# First-level subdomains only: Cloudflare's free certificate covers no
# deeper name, such as app.sandbox.peal.social.
peal_hostnames:
  app: sandbox.peal.social
  site: sandbox-site.peal.social
  docs: sandbox-docs.peal.social
  grafana: sandbox-grafana.peal.social
  ssh: sandbox-ssh.peal.social
# Short links, behind Access as the rest (its Pulumi stack's shortLinkHost).
peal_short_link_hostname: sandbox.peal.link

# The audience tags of the sandbox's Access applications (one covers its
# app, site and docs), its buckets and their endpoints come from its Pulumi
# stack, in cloudflare.yml (scripts/cloudflare_from_pulumi.py).
cloudflare_access_team: winter-resonance-b4ec
peal_access_everything: true

peal_mail_from: Peal Sandbox <notifications@peal.social>

peal_backup_path: /sandbox

# Few people use the sandbox: the server traces every request there.
peal_settings:
  OTEL_TRACES_SAMPLER: parentbased_always_on
  # The platforms' sandbox apps: their ids here, their secrets in the vault.
  YOUTUBE_CLIENT_ID: 342335857798-t4h1dootm1813qo0pe8be46ahidqmo2g.apps.googleusercontent.com
  X_CLIENT_ID: aG1fSFFkWUF1OGJYM2ZZQktRbEk6MTpjaQ
  # One WordPress.com app serves both environments, with both callbacks.
  WORDPRESS_COM_CLIENT_ID: "153160"
  # Google Ads, read only, once its own OAuth client, "Peal: Google Ads",
  # exists in this environment's project (peal-sandbox), with the Google Ads API
  # enabled there: PEAL_ADS: read, PEAL_ADS_NETWORKS (meta,google, or
  # google alone until Meta's app has ads access) and GOOGLE_ADS_CLIENT_ID
  # here, GOOGLE_ADS_CLIENT_SECRET in the vault.
  # One Slack app serves both environments, with both redirect URLs.
  SLACK_CLIENT_ID: "12606763099492.12617179827665"
  # Google sign-in: its own OAuth client, "Peal: Google sign-in", in this
  # environment's project; the consent screen is in Testing until published.
  GOOGLE_SIGN_IN_CLIENT_ID: 342335857798-hn185gb2jd5d4cj7t8vc3ce3t93rcj8j.apps.googleusercontent.com
  # TikTok: the sandbox of the app "Peal", which serves both environments;
  # until TikTok audits it, only its target users connect, posting privately.
  TIKTOK_CLIENT_KEY: sbaw9hybxp3434y7v1
  # Meta: the test app "Peal Sandbox" of production's app "Peal", which
  # shares its use cases and, once granted, its permissions; Facebook Pages
  # and Instagram through a Page. Instagram Login is not offered to new
  # apps, so INSTAGRAM_APP_ID stays unset.
  META_APP_ID: "4619272408353325"
  THREADS_APP_ID: "1621475403358445"
  # Facebook Pages' comments in the inbox and first comments: the parent
  # app "Peal" holds pages_read_user_content and pages_manage_engagement
  # (ready for testing, before App Review). Instagram joins once the app
  # holds instagram_manage_comments.
  PEAL_INBOX_PLATFORMS: facebook
  # X bills each read: the sandbox reads, but little.
  X_ANALYTICS: "true"
  X_ANALYTICS_DAILY_READS: "50"
  # Refuses the staff console to staff whose own account does not have
  # two-step verification on: turn it on for each staff account first.
  PEAL_STAFF_TWO_STEP: "true"

# As in production (group_vars/production says how they are read).
peal_static_build_args:
  SITE_URL: https://sandbox-site.peal.social
  SITE_APP_URL: https://sandbox.peal.social
  SITE_DOCS_URL: https://sandbox-docs.peal.social
  SITE_DISCORD_URL: https://discord.gg/VBZ5pPT9ss
  DOCS_SITE_URL: https://sandbox-docs.peal.social
  DOCS_APP_URL: https://sandbox.peal.social
# The blog at <site>/blog (README.md, "The blog").
peal_blog: true
