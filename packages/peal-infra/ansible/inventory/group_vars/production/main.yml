---
# Production, on peal.social. The host names are the official ones; the
# Cloudflare values (the audience tags, the buckets and their endpoints)
# come from production's Pulumi stack, in cloudflare.yml, which
# scripts/cloudflare_from_pulumi.py writes. The server's address stays off
# Git, in host_vars/peal-production/local.yml (inventory/hosts.yml).
server_hostname: peal-production
peal_environment: production

# Where the server is hosted: the provider, a European company, in lowercase
# as its own site writes it, and the city of its data centre, in lowercase
# English (paris, not the provider's zone, which differs between providers
# for one city). Production is a dedicated server in Paris. Nothing else
# reads them but the uptime server's check that it shares neither
# (group_vars/uptime). README.md, "Choosing a provider and a size", says
# what the stack needs of any provider.
hosting_provider: scaleway
hosting_location: paris

# The account the provider's installer made, whose sudo asks its password
# (README.md, "The image's account"): bootstrap.yml logs in as it, and the
# ssh role removes it once ops works.
bootstrap_user: install

# The installer's swap file, 8 GiB and in fstab already, reused as it is.
swap_file: /swap.img
swap_size_mb: 8192

# Units the server's image runs that nothing here needs, which the system
# role stops and masks (its defaults say why masked, not removed):
system_masked_units:
  # BIND, listening on the public address; nothing resolves through it
  # (systemd-resolved asks the provider's servers, and Docker reads
  # resolved's).
  - named.service
  # Modems, and disks hot-plugged on a desktop: a server has neither.
  - ModemManager.service
  - udisks2.service
  # Multipath storage, and its socket: the disks are a software RAID.
  - multipathd.service
  - multipathd.socket
  # Firmware updates, and their daily refresh: nobody applies firmware from
  # here.
  - fwupd.service
  - fwupd-refresh.timer
  # Crash reports: it has the kernel pipe every crash on the host,
  # containers' processes included, to core files under /var/crash.
  - apport.service
  - apport-autoreport.path
  - apport-forward.socket

# Host names on the Cloudflare zone. Cloudflare's free certificate covers the
# zone and its first-level subdomains only, so no name goes deeper.
peal_hostnames:
  app: app.peal.social
  site: peal.social
  docs: docs.peal.social
  grafana: grafana.peal.social
  ssh: ssh.peal.social
# Short links, public: https://peal.link/<code> (group_vars/all says how it
# is routed). Its DNS record, which production's Pulumi stack makes in the
# peal.link zone, points to this tunnel, through which cf-connecting-ip
# (AUTH_IP_HEADERS) comes, so each visitor has a redirect limit of their own.
peal_short_link_hostname: peal.link

# Cloudflare Zero Trust: the team (<team>.cloudflareaccess.com) and the
# audience tag of each Access application, which cloudflared and Grafana
# check. Production's Pulumi stack makes the applications, and
# scripts/cloudflare_from_pulumi.py writes their tags, the buckets and
# their endpoints into cloudflare.yml. This file is read after it and would
# win, so it holds none of them.
cloudflare_access_team: winter-resonance-b4ec
# Production is public; Access guards Grafana, SSH and peal_access_paths.
peal_access_everything: false

# Resend's sending domain is peal.social.
peal_mail_from: Peal <notifications@peal.social>

# Grafana posts a heartbeat to the uptime server every few minutes, which
# alerts when it stops (group_vars/uptime: uptime_hostname, and the external
# endpoint `grafana heartbeat` of the group `production`). Its token is the
# credential PEAL_HEARTBEAT_TOKEN, which the uptime server generates.
peal_heartbeat_url: https://uptime.peal.social/api/v1/endpoints/production_grafana-heartbeat/external?success=true

# Object storage, in the EU: one bucket for media, one for database backups,
# on any store that speaks the S3 API (README.md, "Object storage"). The
# media endpoint is an https:// URL, the backup endpoint a host. These name
# Cloudflare R2, in the account whose id names the endpoint: both buckets
# are created in R2's EU jurisdiction, which cannot change afterwards and
# whose endpoints carry `.eu.`, so the data stays in the EU. The buckets and
# endpoints are in cloudflare.yml.
peal_backup_path: /production

# The server samples one trace in ten that begins there, and follows the
# decision a request comes with. Every attempt to publish, every request it
# fails and every slow span is traced whatever the ratio, and logs and
# metrics are never sampled (the docs' environment variables page,
# "Telemetry"). Raise the ratio while you investigate; Tempo keeps 14 days.
peal_settings:
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  # Postgres's memory (the docs' environment variables page). The server
  # has 32 GiB and also runs the server, the web app and the telemetry
  # stack, so Postgres takes an eighth for its buffers and counts on 12 GiB
  # of file cache; both disks are solid-state. A change restarts Postgres
  # at the next release; read `SHOW shared_buffers;` after it.
  PEAL_POSTGRES_SHARED_BUFFERS: 4GB
  PEAL_POSTGRES_EFFECTIVE_CACHE_SIZE: 12GB
  PEAL_POSTGRES_MAINTENANCE_WORK_MEM: 512MB
  PEAL_POSTGRES_RANDOM_PAGE_COST: "1.1"
  # The platforms' production apps: their ids here, their secrets in the
  # vault. X's analytics stay off: X bills each read.
  YOUTUBE_CLIENT_ID: 370547380506-ap0ocl7sbbjqgc0n9pihspup46dn9505.apps.googleusercontent.com
  X_CLIENT_ID: OTdwb0p4d0QzaWFpRU5iamYzWGU6MTpjaQ
  # LinkedIn members' profiles: the app "Peal" on Peal's LinkedIn page
  # serves both environments, with both redirect URLs. Company pages take
  # a second app, for the Community Management API, not made yet.
  LINKEDIN_CLIENT_ID: 77p5yfnzeheaa2
  # Meta: the app "Peal" (Facebook Pages, and Instagram through a Page)
  # and its Threads app. Both stay in development mode until App Review,
  # so only the app's roles can connect. Unified login's configuration
  # (META_INSTAGRAM_CONFIG_ID) does not exist in production yet. TikTok
  # stays off: its production configuration is a draft until its audit.
  META_APP_ID: "1687571079381805"
  THREADS_APP_ID: "1116480518049771"
  # One WordPress.com app serves both environments, with both callbacks.
  WORDPRESS_COM_CLIENT_ID: "153160"
  # Google Ads, read only, once its own OAuth client, "Peal: Google Ads",
  # exists in this environment's project (peal-production), with the Google Ads API
  # enabled there: PEAL_ADS: read, PEAL_ADS_NETWORKS (meta,google, or
  # google alone until Meta's app has ads access) and GOOGLE_ADS_CLIENT_ID
  # here, GOOGLE_ADS_CLIENT_SECRET in the vault.
  # One Slack app serves both environments, with both redirect URLs.
  SLACK_CLIENT_ID: "12606763099492.12617179827665"
  # Google sign-in: its own OAuth client, "Peal: Google sign-in", in this
  # environment's project; the consent screen is in Testing until published.
  GOOGLE_SIGN_IN_CLIENT_ID: 370547380506-fhfjmo4u0be3lhtap7pgn26sif06an2o.apps.googleusercontent.com
  # The day billing is turned on, every workspace on the free tier with more
  # accounts than it includes would stop publishing: set the grace's day
  # (YYYY-MM-DD) with STRIPE_SECRET_KEY, a month or so ahead (the docs'
  # environment variables page, "Billing").
  # PEAL_BILLING_GRACE_UNTIL: "2027-01-31"
  # Where the web app sends people who need more than the largest plan
  # allows, a page or a mailto: address. Unset, it tells them to write to
  # whoever runs the server: set it once the address exists.
  # PEAL_CONTACT_URL: https://peal.social/contact/
  # The support chat in the app's bottom bar: Crisp's website "Peal"
  # (hello@peal.social's), public, which browsers send. The privacy policy
  # names Crisp.
  PEAL_CRISP_WEBSITE_ID: 4d7aa8f1-6f97-4c6a-bcd8-79850beab6dc
  # Product analytics: the project's id here, with PEAL_POSTHOG_KEY and
  # PEAL_POSTHOG_PERSONAL_API_KEY in the vault, all three or none: the
  # release refuses one without the others, so this server never captures
  # what it could not delete at PostHog. PostHog's DPA is signed and the
  # privacy policy names PostHog.
  PEAL_POSTHOG_PROJECT_ID: "356475"
  # The web app's measurement (anonymous page views for everyone, replay
  # and identified events after consent): on, as the privacy policy says.
  PEAL_POSTHOG_WEB: "on"
  # Facebook Pages' and Instagram's comments in the inbox: off until Meta's
  # App Review granted the app their permissions, the privacy policy names
  # them (the registry's inbox entry, then the legal pages, through
  # counsel), and one comment was read, answered, hidden and withdrawn on a
  # test Page and a test Instagram account, a feed video's among them (the
  # engagement context's guide). YouTube's: off until Google verified the
  # app for the youtube.force-ssl scope, the privacy policy names YouTube,
  # one comment was read, answered, hidden and withdrawn on a test channel,
  # and the quota was watched for a day (comment reads take half of it).
  # LinkedIn's: off until LinkedIn granted the pages app the Standard tier
  # with r_organization_social_feed and w_organization_social_feed (a
  # pages sign-in fails without them), the privacy policy names LinkedIn,
  # and one comment was read, answered and withdrawn on a test page.
  # Comment reads share the pages app's calls with posting: on the
  # Development tier they take 200 of its 500 and 40 of a member's 100
  # (LINKEDIN_DAILY_COMMENT_CALLS, LINKEDIN_DAILY_COMMENT_CALLS_PER_MEMBER).
  # googleBusiness reads Google Business Profile locations' reviews, once
  # Google gave the project access to the Business Profile APIs and one
  # review was read, answered and its reply deleted on a test location.
  # PEAL_INBOX_PLATFORMS: facebook,instagram,youtube,linkedin,googleBusiness
  # Mastodon's and Bluesky's direct messages in the inbox: no platform's
  # review, but private correspondence, so on only once counsel approved
  # the privacy policy's lines on them and one conversation was read and
  # answered on a test account of each.
  # PEAL_INBOX_MESSAGES: mastodon,bluesky
  # A member's own answer on Messenger and Instagram up to 7 days after
  # the person's last message, with Meta's Human Agent tag: only once
  # Meta's App Review granted the app the Human Agent feature, apart from
  # the messaging permissions, and facebook or instagram is named above.
  # PEAL_META_HUMAN_AGENT: "true"
  # Refuses the staff console to staff whose own account does not have
  # two-step verification on: set once every staff account has it on.
  # PEAL_STAFF_TWO_STEP: "true"

# Read when the static image is built, and the DOCS_* ones when the docs
# image is: a model turns the docs' assistant on (group_vars/all,
# peal_docs_server), with its Anthropic key, DOCS_ANTHROPIC_API_KEY, in the
# vault. DOCS_TURNSTILE_SITE_KEY is the site key of the Turnstile widget
# "Peal docs assistant" (docs.peal.social alone), whose secret,
# DOCS_TURNSTILE_SECRET_KEY, is in the vault: each question is checked,
# beside the rate limit, which counts each reader by cf-connecting-ip.
peal_static_build_args:
  SITE_URL: https://peal.social
  SITE_APP_URL: https://app.peal.social
  SITE_DOCS_URL: https://docs.peal.social
  SITE_DISCORD_URL: https://discord.gg/VBZ5pPT9ss
  # The support chat's Crisp website ("Peal", owned by hello@peal.social),
  # as PEAL_CRISP_WEBSITE_ID gives the app; the blog takes the site's.
  SITE_CRISP_WEBSITE_ID: 4d7aa8f1-6f97-4c6a-bcd8-79850beab6dc
  DOCS_CRISP_WEBSITE_ID: 4d7aa8f1-6f97-4c6a-bcd8-79850beab6dc
  DOCS_SITE_URL: https://docs.peal.social
  DOCS_APP_URL: https://app.peal.social
  DOCS_ASSISTANT_MODEL: claude-haiku-5-5
  DOCS_TURNSTILE_SITE_KEY: 0x4AAAAAAGOhLQlAuZ4sanH1
# The blog at <site>/blog (README.md, "The blog").
peal_blog: true
# The site, the docs and the blog measured with PostHog, through the web
# app's relay (group_vars/all; README.md, "Site measurement"), as the
# privacy policy says. PEAL_POSTHOG_KEY in the vault sends with it.
peal_site_measurement: true
