---
# The credentials outside services issue, for one environment. Copy this file
# to group_vars/<environment>/vault.yml (Git ignores it), fill it in, and
# encrypt it: `uv run ansible-vault encrypt group_vars/production/vault.yml`.
# Or leave the vault out and write the same values on the server (README.md).
# Values shown are placeholders.

# The tunnel's token: `cloudflared tunnel token <tunnel name>` on your own
# machine, for a tunnel created with `cloudflared tunnel create`.
cloudflared_tunnel_token: REPLACE

# Written to /srv/peal/credentials.env as NAME='value', replacing the whole
# file: every key below goes in, not only the ones that change. A single
# quote cannot appear in a value.
peal_credentials:
  # The media bucket's key, which reads and writes objects in that bucket
  # only (on R2, an API token with Object Read & Write on it).
  PEAL_S3_ACCESS_KEY_ID: REPLACE
  PEAL_S3_SECRET_ACCESS_KEY: REPLACE
  # The backup bucket's key, likewise, for that bucket only.
  PGBACKREST_REPO1_S3_KEY: REPLACE
  PGBACKREST_REPO1_S3_KEY_SECRET: REPLACE
  # Encrypts the backups: `openssl rand -base64 48`. Keep a copy outside the
  # server, such as in a password manager: a restore needs it, and the
  # backups cannot be read without it.
  PGBACKREST_REPO1_CIPHER_PASS: REPLACE
  # Email through Resend, or SMTP_URL.
  RESEND_API_KEY: REPLACE
  # The alert bot (from @BotFather) and the id of the channel it writes to,
  # quoted, as "-100…": the sandbox's vault takes the sandbox's own bot and
  # channel (README.md, "Telegram").
  TELEGRAM_BOT_TOKEN: REPLACE
  TELEGRAM_CHAT_ID: REPLACE
  # Optional: the Slack incoming webhook Grafana posts the same alerts to,
  # beside Telegram (README.md, "Slack"): #alerts-production's in
  # production's vault, #alerts-sandbox's in the sandbox's. Left empty,
  # Grafana alerts Telegram alone.
  SLACK_ALERTS_WEBHOOK_URL: ""
  # Where peal_heartbeat_url is set (production): the token Grafana's
  # heartbeat carries, which the uptime server generated, from its
  # /srv/uptime/secrets.env (PRODUCTION_HEARTBEAT_TOKEN; README.md, "Uptime").
  PEAL_HEARTBEAT_TOKEN: REPLACE
  # Where the docs have their assistant (peal_static_build_args names a
  # model: production and the sandbox): the Anthropic API key it answers
  # with, a key of its own, apart from the writing assistant's
  # (PEAL_AI_API_KEY), with a spending limit at Anthropic.
  DOCS_ANTHROPIC_API_KEY: REPLACE
  # Optional, each turning a feature on (the docs' environment variables
  # page): the writing assistant's provider key; Stripe's, with
  # STRIPE_LOOKUP_KEY_PREFIX in peal_settings when its prices' lookup keys
  # do not start with peal; Turnstile's secret, with
  # TURNSTILE_SITE_KEY there; and the secrets of the platforms' apps, with
  # their ids there
  # (LINKEDIN_CLIENT_ID, LINKEDIN_PAGES_CLIENT_ID, X_CLIENT_ID, META_APP_ID,
  # INSTAGRAM_APP_ID, THREADS_APP_ID, TIKTOK_CLIENT_KEY, YOUTUBE_CLIENT_ID,
  # PINTEREST_APP_ID, GOOGLE_BUSINESS_CLIENT_ID). Use the sandbox's Stripe
  # account and apps in the sandbox's vault. Short links need no secret:
  # peal_short_link_hostname sets PEAL_SHORT_LINK_BASE.
  # Meta's, YouTube's and LinkedIn pages' comments in the inbox, and
  # Google Business Profile locations' reviews, need none either:
  # PEAL_INBOX_PLATFORMS goes in peal_settings, beside META_APP_ID,
  # INSTAGRAM_APP_ID, YOUTUBE_CLIENT_ID, LINKEDIN_PAGES_CLIENT_ID or
  # GOOGLE_BUSINESS_CLIENT_ID; PEAL_INBOX_MESSAGES there too, which needs
  # no secret. Websites need nothing either: PEAL_OUTBOUND_ALLOWED_HOSTS is
  # a self-hoster's, refused here by peal_preflight, as Peal's servers never
  # reach a private host.
  # A Stripe key needs write access to meters, products and prices
  # for the catalogue command (README.md, "Stripe catalogue").
  # PEAL_AI_API_KEY: REPLACE
  # PEAL_AI_IMAGE_API_KEY: REPLACE
  # STRIPE_SECRET_KEY: REPLACE
  # STRIPE_WEBHOOK_SECRET: REPLACE
  # STRIPE_METER_WEBHOOK_SECRET: REPLACE
  # TURNSTILE_SECRET_KEY: REPLACE
  # LINKEDIN_CLIENT_SECRET: REPLACE
  # LINKEDIN_PAGES_CLIENT_SECRET: REPLACE
  # X_CLIENT_SECRET: REPLACE
  # META_APP_SECRET: REPLACE
  # INSTAGRAM_APP_SECRET: REPLACE
  # THREADS_APP_SECRET: REPLACE
  # TIKTOK_CLIENT_SECRET: REPLACE
  # YOUTUBE_CLIENT_SECRET: REPLACE
  # PINTEREST_APP_SECRET: REPLACE
  # GOOGLE_BUSINESS_CLIENT_SECRET: REPLACE
