<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- A synthetic picture for the pixel image's specimen: soft greys,
       so the dither has gradients and edges to work on. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#9a9a9a" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d0d0d0" />
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a" />
      <stop offset="1" stop-color="#1a1a1a" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)" />
  <circle cx="470" cy="120" r="60" fill="url(#sun)" />
  <path d="M0 250 C120 180 220 200 320 240 S520 300 640 220 V360 H0 Z" fill="#7a7a7a" />
  <path d="M0 300 C140 250 260 270 380 300 S560 340 640 300 V360 H0 Z" fill="url(#hill)" />
</svg>
